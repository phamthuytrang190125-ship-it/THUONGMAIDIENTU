<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Thuê Của Tôi - WeddingDress</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">WeddingDress</a>

        <div class="d-flex align-items-center gap-3">
            <a href="index.html" class="nav-link text-white">
                <i class="bi bi-house"></i> Trang Chủ
            </a>
            <span class="text-white">Đơn Thuê Của Tôi</span>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h2 class="fw-bold" style="font-family: 'Playfair Display', serif;">
                Đơn Thuê Của Tôi
            </h2>
            <p class="text-muted mb-0">Theo dõi thông tin và trạng thái các đơn thuê váy cưới.</p>
        </div>

        <a href="index.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Tiếp tục thuê váy
        </a>
    </div>

    <div id="message" class="alert alert-info">
        <i class="bi bi-hourglass-split"></i> Đang tải danh sách đơn thuê...
    </div>

    <div id="orders-list" class="row g-4"></div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000/api";

const statusInfo = {
    PENDING: {
        label: "Chờ xác nhận",
        className: "bg-warning text-dark"
    },
    CONFIRMED: {
        label: "Đã xác nhận",
        className: "bg-success"
    },
    RENTING: {
        label: "Đang thuê",
        className: "bg-primary"
    },
    COMPLETED: {
        label: "Hoàn thành",
        className: "bg-secondary"
    },
    CANCELLED: {
        label: "Đã hủy",
        className: "bg-danger"
    }
};

function formatMoney(value) {
    return new Intl.NumberFormat("vi-VN", {
        style: "currency",
        currency: "VND"
    }).format(Number(value) || 0);
}

function formatDate(value) {
    if (!value) return "Chưa có thông tin";

    const parts = String(value).slice(0, 10).split("-");
    if (parts.length !== 3) return value;

    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

async function loadMyOrders() {
    const message = document.getElementById("message");
    const ordersList = document.getElementById("orders-list");
    const token = localStorage.getItem("access_token");

    if (!token) {
        message.className = "alert alert-warning";
        message.innerHTML = `
            Bạn cần đăng nhập để xem đơn thuê.
            <a href="index.html" class="alert-link">Quay lại trang chủ</a>
            để đăng nhập nhé.
        `;
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/my-orders`, {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            message.className = "alert alert-warning";
            message.innerHTML = `
                Phiên đăng nhập không hợp lệ hoặc đã hết hạn.
                Vui lòng <a href="index.html" class="alert-link">quay lại trang chủ</a>
                và đăng nhập lại.
            `;
            return;
        }

        if (!response.ok) {
            throw new Error(`Không thể tải đơn thuê (HTTP ${response.status}).`);
        }

        const orders = await response.json();

        if (!Array.isArray(orders) || orders.length === 0) {
            message.className = "alert alert-info";
            message.innerHTML = `
                <i class="bi bi-inbox"></i>
                Bà chưa có đơn thuê nào.
                <a href="index.html" class="alert-link">Khám phá bộ sưu tập váy cưới</a>.
            `;
            return;
        }

        message.classList.add("d-none");

        ordersList.innerHTML = orders.map(order => {
            const status = statusInfo[order.status] || {
                label: order.status || "Chưa xác định",
                className: "bg-secondary"
            };

            return `
                <div class="col-12">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                                <div>
                                    <h5 class="fw-bold mb-1">
                                        <i class="bi bi-receipt"></i>
                                        Đơn ${escapeHTML(order.order_code || order.id)}
                                    </h5>
                                    <small class="text-muted">
                                        Ngày đặt:
                                        ${escapeHTML(formatDate(order.created_at))}
                                    </small>
                                </div>

                                <span class="badge ${status.className} fs-6">
                                    ${escapeHTML(status.label)}
                                </span>
                            </div>

                            <hr>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <p class="text-muted mb-1">Váy cưới</p>
                                    <div class="fw-semibold">
                                        ${escapeHTML(order.dress_name || "Chưa có thông tin")}
                                    </div>
                                </div>

                                <div class="col-md-3">
                                    <p class="text-muted mb-1">Ngày nhận váy</p>
                                    <div>${escapeHTML(formatDate(order.start_date))}</div>
                                </div>

                                <div class="col-md-3">
                                    <p class="text-muted mb-1">Ngày trả váy</p>
                                    <div>${escapeHTML(formatDate(order.end_date))}</div>
                                </div>

                                <div class="col-md-6">
                                    <p class="text-muted mb-1">Địa chỉ giao hàng</p>
                                    <div>${escapeHTML(order.shipping_address || "Chưa có thông tin")}</div>
                                </div>

                                <div class="col-md-3">
                                    <p class="text-muted mb-1">Số lượng</p>
                                    <div>${escapeHTML(order.quantity ?? 1)}</div>
                                </div>

                                <div class="col-md-3">
                                    <p class="text-muted mb-1">Tiền cọc</p>
                                    <div>${escapeHTML(formatMoney(order.deposit_amount))}</div>
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <span class="text-muted">Tổng tiền thuê</span>
                                <span class="fs-5 fw-bold text-danger">
                                    ${escapeHTML(formatMoney(order.total_amount))}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join("");

    } catch (error) {
        console.error("Lỗi tải đơn thuê:", error);

        message.className = "alert alert-danger";
        message.textContent =
            "Không tải được danh sách đơn thuê. Hãy kiểm tra backend có đang chạy và thử tải lại trang.";
    }
}

loadMyOrders();
</script>

</body>
</html>
